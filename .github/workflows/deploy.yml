name: Déploiement GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /
          VITE_SUPABASE_URL: https://gcjsqxogywmgslkqoojq.supabase.co
          # Clé publishable : publique par conception (protégée par RLS côté Supabase).
          VITE_SUPABASE_KEY: sb_publishable_ZRMYB5vjufp7pW5OocL4Wg_TUiojclo
          # Client ID OAuth Web de Google (public) : active le bouton Google Identity Services (affiche pokebadle.fun).
          VITE_GOOGLE_CLIENT_ID: 158019592036-87g2qp041uq50s3ke0mg9513a3kun5la.apps.googleusercontent.com
          # Clé VAPID publique (notifications push) : variable de dépôt (Settings → Secrets and variables → Actions → Variables). Vide = notifications masquées.
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
